<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"
        integrity="sha384-Bi12oAdYr14AFkifhhBlMiJVpDvueq9uEXPV1B+vtGzvngGIdSIi/k4kDG+YDnyY" crossorigin="anonymous"></script>
<script>
// github pages and the telegram webview cache files for 10 min, so every file gets ?v=<panel_version>
// from the button url: a new version means new urls. Keep these lists in sync with the files.
const CSS = ["base", "finance", "power"];
const JS = ["main", "tg", "bus", "seal", "ui", "icons",
            "sections/answer", "sections/finance", "sections/lamp", "sections/power", "sections/reminders"];
const v = new URLSearchParams(location.search).get("v") || Date.now();
const url = path => new URL(`${path}?v=${v}`, location.href).href;
for (const name of CSS) document.write(`<link rel="stylesheet" href="${url(`css/${name}.css`)}">`);
const imports = Object.fromEntries(JS.map(name => [new URL(`js/${name}.js`, location.href).href, url(`js/${name}.js`)]));
document.write(`<script type="importmap">${JSON.stringify({ imports })}<\/script>`);
document.write(`<script type="module" src="${url("js/main.js")}"><\/script>`);
</script>
</head>
<body>
<section class="screen" id="home"></section>
<div id="toast"></div>
</body>
</html>
