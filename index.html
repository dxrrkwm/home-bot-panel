<!doctype html> <html lang="uk"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"> <title>Панель</title> <script src="https://telegram.org/js/telegram-web-app.js"></script> <style> :root { --bg: var(--tg-theme-bg-color, #f4f8fc); --card: var(--tg-theme-secondary-bg-color, #ffffff); --text: var(--tg-theme-text-color, #1d2733); --hint: var(--tg-theme-hint-color, #8a96a3); --accent: #8ec5ec; --pink: #f6c1d1; } * { box-sizing: border-box; } body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; } h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--hint); margin: 18px 4px 8px; } .card { background: var(--card); border-radius: 14px; padding: 12px; } .row { display: flex; gap: 8px; flex-wrap: wrap; } .row + .row { margin-top: 8px; } button { flex: 1; min-width: 70px; border: 0; border-radius: 10px; padding: 11px 6px; font-size: 15px; background: var(--bg); color: var(--text); cursor: pointer; } button.main { background: var(--accent); color: #10324a; font-weight: 600; } button.pink { background: var(--pink); color: #4a1d2b; font-weight: 600; } input[type=color] { width: 56px; height: 44px; border: 0; padding: 0; background: none; } input[type=range] { flex: 1; accent-color: var(--accent); } input[type=text], input[type=time] { flex: 1; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--hint); background: var(--bg); color: var(--text); font-size: 15px; } label { display: flex; align-items: center; gap: 6px; color: var(--hint); } .swatches button { min-width: 0; height: 36px; padding: 0; } #preview { width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 0 18px var(--glow, #ff8c69); } </style> </head> <body> <h2>💡 Лампа</h2> <div class="card"> <div class="row"> <button data-cmd="💡 Увімкнути">Увімк</button> <button data-cmd="🌑 Вимкнути">Вимк</button> <button data-cmd="🌙 Нічник">Нічник</button> </div> <div class="row"> <button data-cmd="🕯 Тепле">Тепле</button> <button data-cmd="🌤 Денне">Денне</button> <button data-cmd="❄️ Холодне">Холодне</button> </div> <div class="row swatches"> <button style="background:#f6c1d1" data-color="#f6c1d1"></button> <button style="background:#8ec5ec" data-color="#8ec5ec"></button> <button style="background:#ff8c69" data-color="#ff8c69"></button> <button style="background:#b39ddb" data-color="#b39ddb"></button> <button style="background:#a5d6a7" data-color="#a5d6a7"></button> </div> <div class="row" style="align-items:center"> <input type="color" id="color" value="#ff8c69"> <div id="preview"></div> <label style="flex:1">🔆 <input type="range" id="bright" min="1" max="100" value="60"> <span id="bv">60%</span></label> </div> <div class="row"><button class="pink" id="apply">Застосувати колір</button></div> </div> <h2>💻 Ноут</h2> <div class="card"> <div class="row"> <button data-cmd="🔋 Еко">🔋 Еко</button> <button data-cmd="⚡ Звичайний">⚡ Звичайний</button> <button data-cmd="📊 Статус">📊 Статус</button> </div> <div class="row"> <button data-cmd="🔌 Станція">🔌 Станція</button> <button data-cmd="графік">🗓 Графік</button> <button data-cmd="🔄 Оновити виписку">💰 Виписка</button> </div> </div> <h2>⏰ Нагадування</h2> <div class="card"> <div class="row"><input type="text" id="what" placeholder="Що нагадати"></div> <div class="row" style="align-items:center"> <input type="time" id="at" value="10:00"> <label><input type="checkbox" id="tomorrow"> завтра</label> </div> <div class="row"><button class="main" id="remind">Нагадати</button></div> </div> <script> const tg = window.Telegram.WebApp; tg.ready(); tg.expand(); function send(cmd) { tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); tg.sendData(cmd); } const color = document.getElementById("color"); const bright = document.getElementById("bright"); const preview = document.getElementById("preview"); function paint() { preview.style.background = color.value; preview.style.setProperty("--glow", color.value); document.getElementById("bv").textContent = bright.value + "%"; } color.oninput = bright.oninput = paint; paint(); document.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { color.value = b.dataset.color; paint(); }); document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => send(b.dataset.cmd)); document.getElementById("apply").onclick = () => send(color.value.toUpperCase() + " " + bright.value + "%"); document.getElementById("remind").onclick = () => { const what = document.getElementById("what").value.trim(); if (!what) { tg.showAlert("Напиши, що нагадати"); return; } const day = document.getElementById("tomorrow").checked ? "завтра " : ""; send("нагадай " + day + document.getElementById("at").value + " " + what); }; </script> </body> </html>
