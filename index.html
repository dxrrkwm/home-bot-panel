<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17181f);
    --card: var(--tg-theme-secondary-bg-color, #22232d);
    --text: var(--tg-theme-text-color, #f1f2f6);
    --hint: var(--tg-theme-hint-color, #8b8fa3);
    --btn: rgba(127, 127, 160, .14);
    --blue: #9fd0f2;
    --pink: #f7c4d4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 14px 14px 80px; background: var(--bg); color: var(--text);
         font: 15px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; }
  .card { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 12px; }
  .title small { margin-left: auto; color: var(--hint); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid + .grid, .grid + .line, .line + .line, .line + .grid { margin-top: 10px; }
  .line { display: flex; gap: 8px; align-items: center; }
  button { border: 0; border-radius: 12px; padding: 12px 6px; font-size: 14px; background: var(--btn);
           color: var(--text); cursor: pointer; transition: transform .08s, opacity .15s; }
  button:active { transform: scale(.95); opacity: .8; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px; }
  .tile b { font-size: 20px; font-weight: 400; }
  .dot { width: 38px; height: 38px; border-radius: 50%; padding: 0; flex: none; box-shadow: 0 0 0 2px var(--card), 0 0 0 3px transparent; }
  .dot.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--text); }
  .picker { position: relative; overflow: hidden;
            background: conic-gradient(#ff6b6b, #ffd36b, #8be38b, #6bd5ff, #8b8bff, #ff8bd5, #ff6b6b); }
  .picker input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .dots { display: flex; justify-content: space-between; }
  input[type=range] { flex: 1; height: 28px; accent-color: var(--blue); }
  .pct { width: 42px; text-align: right; color: var(--hint); }
  input[type=text] { flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 0; outline: 0;
                     background: var(--btn); color: var(--text); font-size: 15px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { padding: 8px 12px; border-radius: 20px; font-size: 13px; }
  .chips button.on { background: var(--blue); color: #12324a; }
  .main { background: var(--blue); color: #12324a; font-weight: 600; width: 100%; }
  #at { flex: none; width: 84px; text-align: center; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 30px); opacity: 0;
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px;
           transition: all .25s; pointer-events: none; }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }
  .big { font-size: 26px; font-weight: 700; }
  .muted { color: var(--hint); font-size: 13px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .two .card { margin: 0; }
  .bar { height: 8px; border-radius: 4px; background: var(--btn); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--blue); }
  .bar i.pink { background: var(--pink); }
  .cat { display: grid; grid-template-columns: 110px 1fr 64px; gap: 8px; align-items: center; margin-top: 8px; font-size: 13px; }
  .cat .bar { margin: 0; }
  .cat span:last-child { text-align: right; }
  .tx { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--btn); font-size: 14px; }
  .tx:first-of-type { border: 0; }
  .tx div { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plus { color: #8fdca0; }
  svg text { fill: var(--hint); font-size: 9px; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { white-space: pre-wrap; line-height: 1.5; }
  .list button { display: block; width: 100%; text-align: left; padding: 12px; margin-top: 8px; }
  #lampState { margin: -6px 0 12px; font-size: 13px; }
</style>
</head>
<body>

<div id="fin" style="display:none">
  <div class="title" style="padding:0 4px"><button class="back" style="padding:6px 10px">←</button> 💰 Фінанси <small id="fUpd">завантажую…</small></div>
  <div id="fBody"></div>
</div>

<div id="view" style="display:none">
  <div class="title" style="padding:0 4px"><button class="back" style="padding:6px 10px">←</button> <span id="vTitle"></span></div>
  <div class="card"><div id="vText" class="text"></div></div>
  <div class="card list" id="vActions" style="display:none"></div>
</div>

<div id="home">
<div class="card" id="lampCard">
  <div class="title">💡 Лампа <small id="bv">60%</small></div>
  <div class="muted" id="lampState">…</div>
  <div class="grid">
    <button data-cmd="💡 Увімкнути">Увімкнути</button>
    <button data-cmd="🌑 Вимкнути">Вимкнути</button>
    <button data-cmd="🌙 Нічник">Нічник</button>
    <button data-cmd="🕯 Тепле">🕯 Тепле</button>
    <button data-cmd="🌤 Денне">🌤 Денне</button>
    <button data-cmd="❄️ Холодне">❄️ Холодне</button>
  </div>
  <div class="line dots" style="margin-top:14px">
    <button class="dot" style="background:#f7c4d4" data-color="#F7C4D4"></button>
    <button class="dot" style="background:#9fd0f2" data-color="#9FD0F2"></button>
    <button class="dot" style="background:#ff8c69" data-color="#FF8C69"></button>
    <button class="dot" style="background:#c3a6ef" data-color="#C3A6EF"></button>
    <button class="dot" style="background:#a8e0b0" data-color="#A8E0B0"></button>
    <button class="dot picker" id="pickerDot"><input type="color" id="color" value="#ff8c69"></button>
  </div>
  <div class="line" style="margin-top:12px">
    <span>🔅</span><input type="range" id="bright" min="1" max="100" value="60"><span>🔆</span>
  </div>
</div>

<div class="card">
  <div class="title">💻 Ноут</div>
  <div class="grid">
    <button class="tile" data-cmd="🔋 Еко"><b>🔋</b>Еко</button>
    <button class="tile" data-cmd="⚡ Звичайний"><b>⚡</b>Звичайний</button>
    <button class="tile" data-view="📊 Статус"><b>📊</b>Статус</button>
    <button class="tile" data-view="🔌 Станція"><b>🔌</b>Станція</button>
    <button class="tile" data-view="графік"><b>🗓</b>Графік</button>
    <button class="tile" id="openFin"><b>💰</b>Фінанси</button>
  </div>
</div>

<div class="card">
  <div class="title">⏰ Нагадування</div>
  <div class="line"><input type="text" id="what" placeholder="Що нагадати?"></div>
  <div class="chips" style="margin-top:10px">
    <button data-in="15 хв">15 хв</button>
    <button data-in="30 хв" class="on">30 хв</button>
    <button data-in="1 год">1 год</button>
    <button data-in="2 год">2 год</button>
    <button data-in="">о…</button>
  </div>
  <div class="line" id="atLine" style="margin-top:10px; display:none">
    <input type="text" id="at" inputmode="numeric" placeholder="20:00" maxlength="5">
    <div class="chips"><button id="tomorrow">завтра</button></div>
  </div>
  <div class="line" style="margin-top:12px"><button class="main" id="remind">Нагадати</button></div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px">
    <button data-view="📋 Список">📋 Мої нагадування</button>
    <button data-view="💊 Таблетки">💊 Таблетки</button>
  </div>
</div>

</div>

<div id="toast"></div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  const topic = new URLSearchParams(location.search).get("t");
  const $ = id => document.getElementById(id);

  function toast(text) {
    $("toast").textContent = text;
    $("toast").classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => $("toast").classList.remove("show"), 2200);
  }

  // bot answers to the panel through ntfy; next answer goes to the current handler
  let handler = null;
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  async function send(cmd, onAnswer) {
    tg.HapticFeedback?.impactOccurred("light");
    if (!topic) return tg.sendData(cmd);  // old link: fall back to closing mode
    handler = onAnswer || (d => toast(d.text.split("\n")[0]));
    try {
      await fetch("https://ntfy.sh/" + topic, { method: "POST", body: cmd });
    } catch (e) {
      toast("Немає зв'язку");
    }
  }

  const lampAnswer = d => $("lampState").textContent = d.text.replace(/^💡 /, "").split("\n").slice(0, 3).join(" · ");

  // generic screen: shows the bot answer and its buttons
  let viewCmd = null;
  function showView(d) {
    $("vText").textContent = d.text;
    const rows = d.buttons.flat();
    $("vActions").style.display = rows.length ? "block" : "none";
    $("vActions").innerHTML = rows.map(b => `<button data-cb="${esc(b.callback_data)}">${esc(b.text)}</button>`).join("");
    $("vActions").querySelectorAll("[data-cb]").forEach(b => b.onclick = () => {
      const go = () => { $("vText").innerHTML = '<span class="spin">⟳</span>'; send(b.dataset.cb, showView); };
      if (!/^(del|clear)/.test(b.dataset.cb)) return go();
      const ask = "Видалити?\n" + b.textContent.replace(/^❌ /, "");
      tg.isVersionAtLeast("6.2") ? tg.showConfirm(ask, ok => ok && go()) : confirm(ask) && go();
    });
  }
  function openView(cmd, title) {
    viewCmd = cmd;
    $("home").style.display = "none";
    $("view").style.display = "block";
    $("vTitle").textContent = title;
    $("vText").innerHTML = '<span class="spin">⟳</span> завантажую…';
    $("vActions").style.display = "none";
    tg.BackButton.show();
    send(cmd, showView);
  }
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => openView(b.dataset.view, b.textContent.trim()));

  // lamp
  const bright = $("bright");
  let color = null;
  function pick(btn, value) {
    document.querySelectorAll(".dot").forEach(d => d.classList.toggle("on", d === btn));
    color = value;
    send(value + " " + bright.value + "%", lampAnswer);
  }
  document.querySelectorAll("[data-color]").forEach(b => b.onclick = () => pick(b, b.dataset.color));
  $("color").onchange = e => {
    $("pickerDot").style.background = e.target.value;
    pick($("pickerDot"), e.target.value.toUpperCase());
  };
  bright.oninput = () => $("bv").textContent = bright.value + "%";
  bright.onchange = () => send((color ? color + " " : "") + bright.value + "%", lampAnswer);

  document.querySelectorAll("#lampCard [data-cmd]").forEach(b => b.onclick = () => send(b.dataset.cmd, lampAnswer));
  document.querySelectorAll(".tile[data-cmd]").forEach(b => b.onclick = () => send(b.dataset.cmd));

  // reminders
  let when = "30 хв", tomorrow = false;
  document.querySelectorAll("[data-in]").forEach(b => b.onclick = () => {
    document.querySelectorAll("[data-in]").forEach(x => x.classList.toggle("on", x === b));
    when = b.dataset.in;
    $("atLine").style.display = when ? "none" : "flex";
    if (!when) $("at").focus();
  });
  $("tomorrow").onclick = () => { tomorrow = !tomorrow; $("tomorrow").classList.toggle("on", tomorrow); };
  $("at").oninput = e => {
    let v = e.target.value.replace(/\D/g, "").slice(0, 4);
    e.target.value = v.length > 2 ? v.slice(0, 2) + ":" + v.slice(2) : v;
  };
  $("remind").onclick = () => {
    const what = $("what").value.trim();
    if (!what) return toast("Напиши, що нагадати");
    let at;
    if (when) at = "через " + when;
    else if (/^\d{1,2}:\d{2}$/.test($("at").value)) at = (tomorrow ? "завтра " : "") + $("at").value;
    else return toast("Вкажи час, напр. 20:00");
    send("нагадай " + at + " " + what);
    $("what").value = "";
  };

  // finance: bot publishes encrypted summary to ntfy, key comes only in the button url
  const key = new URLSearchParams(location.search).get("k");
  const b64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
  const cat = (...a) => { const r = new Uint8Array(a.reduce((n, x) => n + x.length, 0)); let o = 0; a.forEach(x => { r.set(x, o); o += x.length; }); return r; };
  const money = n => Math.round(n).toLocaleString("uk-UA").replace(/,/g, " ");

  async function unseal(text) {
    const k = await crypto.subtle.importKey("raw", b64(key), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const mac = async d => new Uint8Array(await crypto.subtle.sign("HMAC", k, d));
    const raw = b64(text), nonce = raw.slice(0, 16), ct = raw.slice(16, -16), tag = raw.slice(-16);
    const want = (await mac(cat([109], nonce, ct))).slice(0, 16);
    if (want.some((b, i) => b !== tag[i])) throw new Error("bad tag");
    const out = new Uint8Array(ct.length);
    for (let i = 0; i * 32 < ct.length; i++) {
      const block = await mac(cat([101], nonce, new Uint8Array([i >> 24, i >> 16, i >> 8, i].map(x => x & 255))));
      for (let j = 0; j < 32 && i * 32 + j < ct.length; j++) out[i * 32 + j] = ct[i * 32 + j] ^ block[j];
    }
    const stream = new Blob([out]).stream().pipeThrough(new DecompressionStream("deflate"));
    return JSON.parse(await new Response(stream).text());
  }



  function chart(days, budget) {
    const w = 320, h = 120, max = Math.max(budget * 1.2, ...days.map(d => d[1])), bw = w / days.length;
    const y = v => h - 14 - (v / max) * (h - 24);
    let s = `<svg viewBox="0 0 ${w} ${h}" width="100%">`;
    days.forEach(([d, v], i) => {
      s += `<rect x="${i * bw + 3}" y="${y(v)}" width="${bw - 6}" height="${h - 14 - y(v)}" rx="3" fill="${v > budget ? "#f7c4d4" : "#9fd0f2"}"/>`;
      if (i % 2 === days.length % 2) s += `<text x="${i * bw + bw / 2}" y="${h - 2}" text-anchor="middle">${d.slice(0, 2)}</text>`;
    });
    s += `<line x1="0" x2="${w}" y1="${y(budget)}" y2="${y(budget)}" stroke="#8b8fa3" stroke-dasharray="4 4"/>`;
    return s + `<text x="${w - 2}" y="${y(budget) - 3}" text-anchor="end">${budget}</text></svg>`;
  }

  function goods(list) {
    if (!list.length) return "";
    const items = list.map(g => `<div class="tx" style="display:block"><div class="line"><b>${g.t}</b>${g.v != null ? `<span class="plus" style="margin-left:auto">${money(g.v)} грн</span>` : ""}</div>
      <div class="muted" style="white-space:normal;margin-top:4px">${g.d}</div></div>`).join("");
    return `<div class="card"><div class="line"><span>✅ Що добре — тримай так</span><span class="muted" style="margin-left:auto">30 днів</span></div>${items}</div>`;
  }

  function tips(list) {
    if (!list.length) return "";
    const save = list.reduce((n, t) => n + t.save, 0);
    const items = list.map(t => `<div class="tx" style="display:block"><div class="line"><b>${t.t}</b><span class="muted" style="margin-left:auto">${money(t.v)} грн</span></div>
      <div class="muted" style="white-space:normal;margin-top:4px">${t.d}</div>
      ${t.save ? `<div class="plus" style="margin-top:4px;font-size:13px">≈ −${money(t.save)} грн/міс</div>` : ""}</div>`).join("");
    return `<div class="card"><div class="line"><span>💡 Зайве і як краще</span><span class="muted" style="margin-left:auto">30 днів</span></div>
      ${save ? `<div style="margin:8px 0;padding:10px;border-radius:12px;background:var(--btn)">Можна зберегти <b class="plus">≈ ${money(save)} грн/міс</b> — це ${money(save * 12)} на рік</div>` : ""}${items}</div>`;
  }

  function render(d) {
    $("fUpd").innerHTML = (d.syncing ? '<span class="spin">⟳</span> оновлюю · ' : "") + "оновлено " + d.upd;
    const today = d.days[d.days.length - 1][1], left = d.budget - today;
    const cards = d.cards.map(c => c.lim
      ? `<div class="card"><div class="muted">⚫ ${c.n} · борг</div><div class="big">${money(c.debt)}</div>
         <div class="bar"><i class="pink" style="width:${100 * c.debt / c.lim}%"></i></div><div class="muted" style="margin-top:4px">з ${money(c.lim)}</div></div>`
      : `<div class="card"><div class="muted">⚪ ${c.n}</div><div class="big">${money(c.bal)}</div><div class="muted">грн</div></div>`).join("");
    const jars = d.jars.map(j => `<div style="margin-top:10px"><div class="line"><span>🫙 ${j.n}</span><span class="muted" style="margin-left:auto">${money(j.bal)}${j.goal ? " / " + money(j.goal) : ""}</span></div>
      ${j.goal ? `<div class="bar"><i style="width:${Math.min(100, 100 * j.bal / j.goal)}%"></i></div>` : ""}</div>`).join("");
    const top = d.cats.length ? d.cats[0][1] : 1;
    const cats = d.cats.map(([n, v]) => `<div class="cat"><span>${n}</span><div class="bar"><i style="width:${100 * v / top}%"></i></div><span>${money(v)}</span></div>`).join("");
    const tx = d.tx.map(([t, desc, a]) => `<div class="tx"><div><div>${desc}</div><div class="muted">${t}</div></div><b class="${a > 0 ? "plus" : ""}">${a > 0 ? "+" : ""}${money(a)}</b></div>`).join("");
    $("fBody").innerHTML = `
      <div class="two">${cards}</div>
      <div class="card" style="margin-top:12px">
        <div class="line"><span>Сьогодні</span><span class="muted" style="margin-left:auto">${left >= 0 ? "ще можна " + money(left) : "понад на " + money(-left)}</span></div>
        <div class="big">${money(today)} <span class="muted">/ ${d.budget} грн</span></div>
        <div class="bar"><i class="${left < 0 ? "pink" : ""}" style="width:${Math.min(100, 100 * today / d.budget)}%"></i></div>
      </div>
      <div class="card"><div class="line"><span>14 днів</span><span class="muted" style="margin-left:auto">в середньому ${money(d.avg7)}/день</span></div>${chart(d.days, d.budget)}</div>
      <div class="card"><div class="line"><span>Цей місяць</span></div>
        <div class="two" style="margin-top:6px"><div><div class="muted">витрати</div><div class="big">${money(d.mspent)}</div></div>
        <div><div class="muted">надходження</div><div class="big plus">${money(d.mincome)}</div></div></div>${cats}</div>
      ${goods(d.goods || [])}
      ${tips(d.tips || [])}
      ${jars ? `<div class="card"><div>Банки</div>${jars}</div>` : ""}
      <div class="card"><div style="margin-bottom:4px">Останні операції</div>${tx}</div>`;
  }

  let finOpen = false;
  async function openFin() {
    finOpen = true;
    $("home").style.display = "none";
    $("fin").style.display = "block";
    tg.BackButton.show();
    try {
      const r = await fetch(`https://ntfy.sh/${topic}d/json?poll=1&since=12h`);
      const fin = (await r.text()).trim().split("\n").filter(Boolean).map(JSON.parse).filter(e => e.title === "fin").pop();
      if (fin) render(await unseal(fin.message));
    } catch (e) {}
    fetch("https://ntfy.sh/" + topic, { method: "POST", body: "fin-panel" });
  }
  function closeFin() {
    finOpen = false;
    viewCmd = null;
    $("fin").style.display = "none";
    $("view").style.display = "none";
    $("home").style.display = "block";
    tg.BackButton.hide();
  }
  $("openFin").onclick = () => { if (!key) return toast("Відкрий панель з кнопки бота"); openFin(); };
  tg.BackButton.onClick(closeFin);
  document.querySelectorAll(".back").forEach(b => b.onclick = closeFin);

  if (topic && key) {
    const es = new EventSource(`https://ntfy.sh/${topic}d/sse`);
    es.onmessage = async e => {
      const m = JSON.parse(e.data);
      if (m.event !== "message") return;
      const d = await unseal(m.message).catch(() => null);
      if (!d) return;
      if (m.title === "fin") { if (finOpen) render(d); return; }
      const h = handler;
      handler = null;
      (h || (x => toast(x.text.split("\n")[0])))(d);
    };
    setTimeout(() => send("lamp?", lampAnswer), 500);
  }
</script>
</body>
</html>
